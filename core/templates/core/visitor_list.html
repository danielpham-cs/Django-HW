{% extends "core/base.html" %}
{% block title %}Users · TravelRec{% endblock %}

{% block content %}
<section class="panel">
    <div class="panel-head">
        <h1>Users</h1>
    </div>
    <table class="table">
        <thead>
            <tr><th>ID</th><th>Name</th><th>Age</th></tr>
        </thead>
        <tbody>
            {% for v in visitors %}
            <tr>
                <td>{{ v.id }}</td>
                <td>{{ v.name }}</td>
                <td>{{ v.age }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="empty">No users yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
